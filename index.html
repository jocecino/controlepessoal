<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Por Fora</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0f766e;--bd:#e3e6ea;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--onpri:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eceff2;--mut:#98a1ad;--pri:#2dd4bf;--bd:#2b323a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--onpri:#06201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}
.k{color:var(--mut);font-size:12px}.v{font-size:19px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
label{font-size:13px;color:var(--mut)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.al{border-left:4px solid var(--warn)}.al.b{border-left-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;font-size:10.5px;color:var(--mut);padding:4px 0;cursor:pointer}
nav button span{display:block;font-size:19px}nav button.on{color:var(--pri);font-weight:700}
.bars{display:flex;gap:8px;margin-top:8px}.bars .g{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:90px;justify-content:center}
.bars i{display:block;width:12px;border-radius:3px 3px 0 0;min-height:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:340px;text-align:center}
.done{text-decoration:line-through;color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== CONFIG: https://docs.google.com/spreadsheets/d/1sHyfi-uCr4E1s50Syxy-CMjG9ifcKXE5DssW6JMVukQ/edit?gid=0#gid=0. Vazio = modo local de teste ===== */
const API_URL='';
const ST=['A fazer','Em andamento','Concluído','Entregue','Pago'];
const CATS=['Material','Ferramentas','Transporte','Pagamento de cliente','Pessoal','Alimentação','Outros'];
const FORMAS=['Pix','Dinheiro','Débito','Transferência'];
const K=['servicos','lancamentos','tarefas','contas','cartoes','faturas'];
let D={},SENHA='',auth=false,view='dash',SS='',F={sv:'Todos',tf:'A fazer',mes:'',cat:'',cli:'',org:''};
K.forEach(k=>D[k]=[]);
const mem={},store={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>{const t=new Date(y,m-1,d);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const hoje=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fd=d=>d?String(d).split('-').reverse().join('/'):'—';
const mesDe=d=>String(d||'').slice(0,7),mesFmt=k=>k.slice(5)+'/'+k.slice(0,4);
const addM=(d,n)=>{const [y,m,dd]=d.split('-').map(Number),last=new Date(y,m-1+n+1,0).getDate();return ymd(y,m+n,Math.min(dd,last))};
const dias=d=>Math.round((new Date(d+'T12:00')-new Date(hoje()+'T12:00'))/864e5);
const api=(action,x={})=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,senha:SENHA,...x})}).then(r=>r.json());

/* ===== dados ===== */
const N=(a,ks)=>a.forEach(o=>ks.forEach(k=>o[k]=+o[k]||0)),B=(a,ks)=>a.forEach(o=>ks.forEach(k=>o[k]=o[k]===true||o[k]==='TRUE'||o[k]==='true'));
function norm(){let seed=false;K.forEach(k=>D[k]=D[k]||[]);
  N(D.servicos,['valor','recebido']);N(D.lancamentos,['valor']);N(D.contas,['saldoInicial']);N(D.cartoes,['limite','fechamento','vencimento']);N(D.faturas,['valor']);
  B(D.lancamentos,['pend','fatura']);B(D.tarefas,['feita']);B(D.contas,['encerrada']);B(D.cartoes,['encerrado']);B(D.faturas,['pago']);
  if(!D.contas.length){seed=true;['Bradesco','Itaú','PicPay','Espécie'].forEach(n=>D.contas.push({id:uid(),nome:n,saldoInicial:0,encerrada:false}))}
  return seed}
let tm;function setSS(t){SS=t;const e=$('#ss');if(e)e.textContent=t}
function save(){if(!API_URL){store.set('cpf_data',JSON.stringify(D));return}
  setSS('⏳ Salvando…');clearTimeout(tm);
  tm=setTimeout(async()=>{try{const r=await api('salvar',{dados:D});setSS(r.ok?'☁️ Salvo na planilha':'⚠️ '+r.erro)}catch(e){setSS('⚠️ Sem conexão. Altere algo para tentar de novo')}},700)}
const contasAt=()=>D.contas.filter(c=>!c.encerrada),cartoesAt=()=>D.cartoes.filter(c=>!c.encerrado);
const movConta=id=>D.lancamentos.filter(l=>l.contaId===id&&!l.cartaoId&&!l.pend);
const saldo=c=>c.saldoInicial+movConta(c.id).reduce((a,l)=>a+(l.tipo==='Receita'?l.valor:-l.valor),0);
const cliNome=id=>(D.servicos.find(s=>s.id===id)||{}).cliente||'';
const orgNome=l=>l.cartaoId?'💳 '+((D.cartoes.find(c=>c.id===l.cartaoId)||{}).nome||'?'):'🏦 '+((D.contas.find(c=>c.id===l.contaId)||{}).nome||'—');
function orgOpts(despesa,cur){const o=[];D.contas.filter(c=>!c.encerrada||'c:'+c.id===cur).forEach(c=>o.push(['c:'+c.id,'🏦 '+c.nome]));
  if(despesa)D.cartoes.filter(c=>!c.encerrado||'k:'+c.id===cur).forEach(c=>o.push(['k:'+c.id,'💳 '+c.nome+' (crédito)']));return o}

/* ===== faturas de cartão ===== */
const chave=(c,date)=>{let [y,m,d]=date.split('-').map(Number);if(d>c.fechamento)m++;const t=new Date(y,m-1,1);return t.getFullYear()+'-'+pad(t.getMonth()+1)};
const venc=(c,k)=>{let [y,m]=k.split('-').map(Number);if(c.vencimento<=c.fechamento)m++;const t=new Date(y,m-1,1),ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(t.getFullYear(),t.getMonth()+1,Math.min(c.vencimento,ult))};
function listaFaturas(){const out=[];D.cartoes.forEach(c=>{const g={};D.lancamentos.filter(l=>l.cartaoId===c.id).forEach(l=>{const k=chave(c,l.data);g[k]=(g[k]||0)+l.valor});
  Object.keys(g).forEach(k=>{const id=c.id+'|'+k,p=D.faturas.find(f=>f.id===id&&f.pago);out.push({id,c,k,total:Math.round(g[k]*100)/100,venc:venc(c,k),pago:!!p})})});
  return out.sort((a,b)=>a.venc.localeCompare(b.venc))}
const alertas=()=>listaFaturas().filter(f=>!f.pago&&f.total>0&&dias(f.venc)<=7);
function statusFat(f){if(f.pago)return'Paga';const d=dias(f.venc);return d<0?`Vencida há ${-d} dia(s)`:d===0?'Vence hoje':d<=7?`Vence em ${d} dia(s)`:'Em aberto'}

/* ===== login / render ===== */
function login(){
  $('#app').innerHTML=`<div class="login"><div class="card"><h1>🛠️ Controle Por Fora</h1><p class="k">Digite sua senha${API_URL?'':' (modo local de teste, sem planilha)'}</p>
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><div id="er" class="bad" style="min-height:18px;font-size:13px"></div>
  <button class="btn" style="width:100%" id="go">Entrar</button></div></div>`;
  const go=async()=>{const p=$('#pw').value;SENHA=p;
    if(API_URL){$('#er').textContent='Carregando…';try{const r=await api('login');if(!r.ok){$('#er').textContent=r.erro;return}D=r.dados}catch(e){$('#er').textContent='Sem conexão com a planilha.';return}}
    else{if(p!==(store.get('cpf_pw')||'admin2026')){$('#er').textContent='Senha incorreta.';return}try{const s=store.get('cpf_data');if(s)D=JSON.parse(s)}catch(e){}}
    auth=true;if(norm())save();setSS(API_URL?'☁️ Conectado à planilha':'');render()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function render(){
  if(!auth)return login();
  const n=alertas().length,nav=[['dash','📊','Relatório'],['serv','🛠️','Serviços'],['lanc','➕','Lançar'],['tar','✅','Tarefas'],['cont','🏦','Contas'],['hist','🕒','Extrato']];
  $('#app').innerHTML=`<main><div class="k" id="ss" style="text-align:right">${E(SS)}</div><div id="m"></div></main><nav>${nav.map(x=>`<button class="${view===x[0]?'on':''}" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}${x[0]==='cont'&&n?` <b style="color:var(--bad)">●${n}</b>`:''}</button>`).join('')}</nav>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  ({dash,serv,lanc,tar,cont,hist})[view]();window.scrollTo(0,0);
}

/* ===== modal genérico ===== */
function form(title,fields,vals,onSave,onDel){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h1>${title}</h1>${fields.map(f=>{const v=vals[f.k]??'';
    if(f.t==='select')return`<label>${f.l}</label><select data-k="${f.k}">${f.o.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return`<option value="${E(ov)}" ${ov==v?'selected':''}>${E(ol)}</option>`}).join('')}</select>`;
    if(f.t==='checkbox')return`<label style="display:block;margin-bottom:10px"><input type="checkbox" data-k="${f.k}" ${v?'checked':''}>${f.l}</label>`;
    if(f.t==='textarea')return`<label>${f.l}</label><textarea rows="2" data-k="${f.k}">${E(v)}</textarea>`;
    return`<label>${f.l}</label><input type="${f.t||'text'}" ${f.t==='number'?'step="0.01" inputmode="decimal"':''} data-k="${f.k}" value="${E(v)}">`}).join('')}
  <div class="row"><button class="btn sec" id="cx">Cancelar</button>${onDel?'<button class="btn sec bad" id="dl">Excluir</button>':''}<button class="btn" id="sv">Salvar</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();
  m.onclick=e=>{if(e.target===m)close()};m.querySelector('#cx').onclick=close;
  if(onDel)m.querySelector('#dl').onclick=()=>{if(confirm('Excluir este item?')){onDel();close();save();render()}};
  m.querySelector('#sv').onclick=()=>{const o={};
    m.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='checkbox'?i.checked:i.type==='number'?parseFloat(i.value)||0:i.value.trim());
    if(onSave(o)===false)return;close();save();render()};
}

/* ===== relatório ===== */
function dash(){
  const L=D.lancamentos,rec=L.filter(l=>l.tipo==='Receita'&&!l.pend),des=L.filter(l=>l.tipo==='Despesa'&&!l.pend&&!l.fatura);
  const S=a=>a.reduce((x,l)=>x+l.valor,0),sm=(a,m)=>S(a.filter(l=>mesDe(l.data)===m));
  const tot=D.contas.reduce((a,c)=>a+saldo(c),0);
  const aRec=D.servicos.filter(s=>s.status!=='Pago').reduce((a,s)=>a+s.valor-s.recebido,0);
  const aPag=S(L.filter(l=>l.tipo==='Despesa'&&l.pend&&!l.cartaoId))+listaFaturas().filter(f=>!f.pago).reduce((a,f)=>a+f.total,0);
  const mes=hoje().slice(0,7),mr=sm(rec,mes),md=sm(des,mes),al=alertas();
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();ms.push(mesDe(ymd(d.getFullYear(),d.getMonth()+1-i,1)))}
  const dd=ms.map(m=>[m,sm(rec,m),sm(des,m)]),mx=Math.max(1,...dd.flatMap(d=>[d[1],d[2]]));
  $('#m').innerHTML=`<h1>📊 Relatório</h1>
  ${al.map(f=>`<div class="card al ${dias(f.venc)<0?'b':''} row"><div><b>💳 ${E(f.c.nome)}</b> · ${brl(f.total)}<div class="k">${statusFat(f)} · ${fd(f.venc)}</div></div><button class="btn sm" data-pf="${f.id}">Pagar</button></div>`).join('')}
  <div class="grid"><div class="card"><div class="k">Saldo total (contas)</div><div class="v ${tot<0?'bad':'ok'}">${brl(tot)}</div></div>
  <div class="card"><div class="k">A receber</div><div class="v">${brl(aRec)}</div></div>
  <div class="card"><div class="k">A pagar (incl. faturas)</div><div class="v bad">${brl(aPag)}</div></div>
  <div class="card"><div class="k">Resultado do mês</div><div class="v ${mr-md<0?'bad':'ok'}">${brl(mr-md)}</div></div></div>
  <div class="card"><div class="k">Saldo por conta</div>${contasAt().map(c=>`<div class="row"><span>${E(c.nome)}</span><b class="${saldo(c)<0?'bad':''}">${brl(saldo(c))}</b></div>`).join('')}</div>
  <div class="card"><div class="row"><span>Entradas no mês</span><b class="ok">${brl(mr)}</b></div><div class="row"><span>Saídas no mês</span><b class="bad">${brl(md)}</b></div>
  <div class="row"><span>Serviços em aberto</span><b>${D.servicos.filter(s=>['A fazer','Em andamento'].includes(s.status)).length}</b></div><div class="row"><span>Tarefas pendentes</span><b>${D.tarefas.filter(t=>!t.feita).length}</b></div></div>
  <div class="card"><div class="k">Últimos 6 meses · 🟩 receitas 🟥 despesas</div><div class="bars">${dd.map(d=>`<div class="g"><div class="p"><i style="height:${d[1]/mx*100}%;background:var(--ok)"></i><i style="height:${d[2]/mx*100}%;background:var(--bad)"></i></div>${mesFmt(d[0]).slice(0,2)}/${d[0].slice(2,4)}</div>`).join('')}</div></div>
  <div class="row"><button class="btn sec sm" id="pw">🔑 Trocar senha</button><button class="btn sec sm" id="lo">Sair</button></div>`;
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>pagarFatura(listaFaturas().find(f=>f.id===b.dataset.pf)));
  $('#lo').onclick=()=>{auth=false;SENHA='';render()};
  $('#pw').onclick=async()=>{const n=prompt('Nova senha (mínimo 4 caracteres):');if(!n)return;if(n.length<4)return alert('Senha muito curta.');
    if(API_URL){try{const r=await api('trocarSenha',{nova:n});if(r.ok){SENHA=n;alert('Senha alterada.')}else alert(r.erro)}catch(e){alert('Sem conexão.')}}else{store.set('cpf_pw',n);alert('Senha alterada (modo local).')}};
}

/* ===== serviços ===== */
function serv(){
  const lista=D.servicos.filter(s=>F.sv==='Todos'||s.status===F.sv).sort((a,b)=>(a.entrega||'9').localeCompare(b.entrega||'9'));
  $('#m').innerHTML=`<div class="row"><h1>🛠️ Serviços</h1><button class="btn sm" id="nv">+ Novo</button></div>
  <div class="chips">${['Todos',...ST].map(s=>`<div class="chip ${F.sv===s?'on':''}" data-s="${s}">${s}</div>`).join('')}</div>
  ${lista.length?lista.map(s=>{const tf=D.tarefas.filter(t=>t.servicoId===s.id);return`<div class="card" data-id="${s.id}" style="cursor:pointer">
   <div class="row"><b>${E(s.cliente)}</b><b>${brl(s.valor)}</b></div><div>${E(s.desc)}</div>
   <div class="row" style="margin-top:6px"><span class="tag">${s.status}</span><span class="k">Entrega: ${fd(s.entrega)}${tf.length?` · ✅ ${tf.filter(t=>t.feita).length}/${tf.length}`:''}${s.status!=='Pago'&&s.recebido?` · recebido ${brl(s.recebido)}`:''}</span></div></div>`}).join(''):'<div class="empty">Nenhum serviço aqui ainda.</div>'}`;
  $('#nv').onclick=()=>editServ({status:'A fazer',entrega:hoje(),contaId:(contasAt()[0]||{}).id});
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{F.sv=c.dataset.s;serv()});
  document.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>editServ(D.servicos.find(s=>s.id===c.dataset.id)));
}
function editServ(s){
  const novo=!s.id;
  form(novo?'Novo serviço':'Editar serviço',[
    {k:'cliente',l:'Cliente'},{k:'desc',l:'Descrição do serviço',t:'textarea'},{k:'valor',l:'Valor (R$)',t:'number'},
    {k:'recebido',l:'Já recebido (R$)',t:'number'},{k:'entrega',l:'Data de entrega',t:'date'},{k:'status',l:'Status',t:'select',o:ST},
    {k:'forma',l:'Forma de pagamento',t:'select',o:['',...FORMAS]},{k:'contaId',l:'Conta que recebe',t:'select',o:contasAt().map(c=>[c.id,c.nome])}],s,
    o=>{if(!o.cliente){alert('Informe o cliente.');return false}
      const sv=novo?{id:uid()}:D.servicos.find(x=>x.id===s.id),jaRec=novo?0:sv.recebido||0;
      Object.assign(sv,o);if(sv.status==='Pago')sv.recebido=sv.valor;if(novo)D.servicos.push(sv);
      const dif=sv.recebido-jaRec;
      if(dif>0)D.lancamentos.push({id:uid(),tipo:'Receita',cat:'Pagamento de cliente',forma:sv.forma||'Pix',valor:dif,data:hoje(),desc:'Serviço: '+sv.cliente,servicoId:sv.id,pend:false,contaId:sv.contaId,cartaoId:'',fatura:false});
    },novo?null:()=>{D.servicos=D.servicos.filter(x=>x.id!==s.id);D.tarefas.forEach(t=>{if(t.servicoId===s.id)t.servicoId=''})});
}

/* ===== lançar ===== */
function lanc(){
  let tipo='Receita';
  $('#m').innerHTML=`<h1>➕ Novo lançamento</h1><div class="card"><div class="chips"><div class="chip on" id="tr">Receita</div><div class="chip" id="td">Despesa</div></div><div id="f"></div></div>`;
  const f=()=>{const des=tipo==='Despesa';
    $('#f').innerHTML=`<label>Valor (R$)</label><input id="vl" type="number" step="0.01" inputmode="decimal">
    <label>Data</label><input id="dt" type="date" value="${hoje()}">
    <label>${des?'Pago com':'Entrou em'}</label><select id="or">${orgOpts(des).map(o=>`<option value="${o[0]}">${E(o[1])}</option>`).join('')}</select>
    <div id="fmw"><label>Forma de pagamento</label><select id="fm">${FORMAS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div id="pcw" style="display:none"><label>Parcelas (cartão)</label><input id="pc" type="number" min="1" value="1"></div>
    <label>Categoria</label><select id="ct">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Serviço (opcional)</label><select id="sv"><option value="">—</option>${D.servicos.map(s=>`<option value="${s.id}">${E(s.cliente)} – ${E(s.desc).slice(0,30)}</option>`).join('')}</select>
    <label>Descrição</label><input id="ds">
    <label style="display:block;margin-bottom:10px"><input type="checkbox" id="pd">Ainda pendente (${des?'a pagar':'a receber'})</label>
    <button class="btn" id="ok" style="width:100%">Salvar ${tipo.toLowerCase()}</button>`;
    const tg=()=>{const k=$('#or').value[0]==='k';$('#fmw').style.display=k?'none':'';$('#pcw').style.display=k?'':'none'};$('#or').onchange=tg;tg();
    $('#ok').onclick=()=>{const v=parseFloat($('#vl').value);if(!v||v<=0)return alert('Informe um valor válido.');
      const [ot,oid]=$('#or').value.split(':'),card=ot==='k',np=card?Math.max(1,parseInt($('#pc').value)||1):1;
      const base={tipo,cat:$('#ct').value,forma:card?'Crédito':$('#fm').value,servicoId:$('#sv').value,pend:!card&&$('#pd').checked,contaId:card?'':oid,cartaoId:card?oid:'',fatura:false};
      const dt=$('#dt').value||hoje(),desc=$('#ds').value.trim(),vp=Math.floor(v/np*100)/100;let acc=0;
      for(let i=0;i<np;i++){const val=i===np-1?Math.round((v-acc)*100)/100:vp;acc+=vp;
        D.lancamentos.push({id:uid(),...base,valor:val,data:addM(dt,i),desc:np>1?`${desc} (${i+1}/${np})`.trim():desc})}
      save();view='hist';render()}};
  $('#tr').onclick=()=>{tipo='Receita';$('#tr').classList.add('on');$('#td').classList.remove('on');f()};
  $('#td').onclick=()=>{tipo='Despesa';$('#td').classList.add('on');$('#tr').classList.remove('on');f()};
  f();
}

/* ===== tarefas ===== */
function tar(){
  const lista=D.tarefas.filter(t=>F.tf==='Todas'||(F.tf==='A fazer')===!t.feita);
  $('#m').innerHTML=`<div class="row"><h1>✅ Atividades</h1><button class="btn sm" id="nv">+ Nova</button></div>
  <div class="chips">${['A fazer','Concluídas','Todas'].map(s=>`<div class="chip ${F.tf===s?'on':''}" data-s="${s}">${s}</div>`).join('')}</div>
  ${lista.length?lista.map(t=>`<div class="card row"><label style="display:flex;gap:10px;align-items:center;color:var(--tx);flex:1"><input type="checkbox" data-t="${t.id}" ${t.feita?'checked':''} style="width:20px;height:20px;margin:0"><span class="${t.feita?'done':''}">${E(t.texto)}${t.servicoId?`<br><span class="k">🛠️ ${E(cliNome(t.servicoId))}</span>`:''}</span></label><button class="btn sec sm" data-e="${t.id}">✏️</button></div>`).join(''):'<div class="empty">Nada por aqui.</div>'}`;
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{F.tf=c.dataset.s;tar()});
  document.querySelectorAll('[data-t]').forEach(c=>c.onchange=()=>{D.tarefas.find(t=>t.id===c.dataset.t).feita=c.checked;save();tar()});
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editTar(D.tarefas.find(t=>t.id===b.dataset.e)));
  $('#nv').onclick=()=>editTar({});
}
function editTar(t){
  const novo=!t.id;
  form(novo?'Nova atividade':'Editar atividade',[{k:'texto',l:'Atividade'},{k:'servicoId',l:'Vincular a serviço',t:'select',o:[['','— nenhum —'],...D.servicos.map(s=>[s.id,s.cliente+' – '+s.desc.slice(0,25)])]}],t,
  o=>{if(!o.texto){alert('Descreva a atividade.');return false}if(novo)D.tarefas.push({id:uid(),feita:false,...o});else Object.assign(t,o)},novo?null:()=>{D.tarefas=D.tarefas.filter(x=>x.id!==t.id)});
}

/* ===== contas, cartões e faturas ===== */
function cont(){
  const fs=listaFaturas(),abertas=fs.filter(f=>!f.pago),pagas=fs.filter(f=>f.pago).reverse().slice(0,5);
  const ord=[...D.contas].sort((a,b)=>a.encerrada-b.encerrada),ordC=[...D.cartoes].sort((a,b)=>a.encerrado-b.encerrado);
  $('#m').innerHTML=`<h1>🏦 Contas e cartões</h1>
  <div class="sec-h"><h2>Bancos e espécie</h2><button class="btn sm" id="nc">+ Conta</button></div>
  ${ord.map(c=>`<div class="card row" data-c="${c.id}" style="cursor:pointer"><div><b>${E(c.nome)}</b>${c.encerrada?' <span class="tag">encerrada</span>':''}</div><b class="${saldo(c)<0?'bad':''}">${brl(saldo(c))}</b></div>`).join('')}
  <div class="sec-h"><h2>Cartões de crédito</h2><button class="btn sm" id="nk">+ Cartão</button></div>
  ${ordC.length?ordC.map(c=>{const usado=abertas.filter(f=>f.c.id===c.id).reduce((a,f)=>a+f.total,0);return`<div class="card" data-k="${c.id}" style="cursor:pointer"><div class="row"><b>💳 ${E(c.nome)}${c.encerrado?' <span class="tag">encerrado</span>':''}</b><b>${brl(usado)}</b></div>
   <div class="k">Fecha dia ${c.fechamento} · vence dia ${c.vencimento}${c.limite?` · limite ${brl(c.limite)} (disp. ${brl(c.limite-usado)})`:''}</div></div>`}).join(''):'<div class="empty">Nenhum cartão cadastrado.</div>'}
  <div class="sec-h"><h2>Faturas</h2></div>
  ${[...abertas,...pagas].map(f=>`<div class="card al ${f.pago?'':dias(f.venc)<0?'b':dias(f.venc)<=7?'':'x'} row" style="${f.pago||dias(f.venc)>7?'border-left-color:var(--bd)':''}"><div><b>${E(f.c.nome)}</b> · ${mesFmt(f.k)} · ${brl(f.total)}<div class="k">${statusFat(f)} · venc. ${fd(f.venc)}</div></div>${f.pago?'':`<button class="btn sm" data-pf="${f.id}">Pagar</button>`}</div>`).join('')||'<div class="empty">Sem faturas ainda. Lance uma despesa no cartão.</div>'}`;
  $('#nc').onclick=()=>editConta({saldoInicial:0});$('#nk').onclick=()=>editCartao({});
  document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>editConta(D.contas.find(c=>c.id===e.dataset.c)));
  document.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>editCartao(D.cartoes.find(c=>c.id===e.dataset.k)));
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>pagarFatura(fs.find(f=>f.id===b.dataset.pf)));
}
function editConta(c){
  const novo=!c.id,tem=!novo&&D.lancamentos.some(l=>l.contaId===c.id);
  form(novo?'Nova conta':'Editar conta',[{k:'nome',l:'Nome (banco, carteira, espécie…)'},{k:'saldoInicial',l:'Saldo inicial (R$)',t:'number'},{k:'encerrada',l:'Conta encerrada (sai das opções, mantém o histórico)',t:'checkbox'}],c,
  o=>{if(!o.nome){alert('Informe o nome.');return false}if(novo)D.contas.push({id:uid(),...o});else Object.assign(c,o)},
  novo||tem?null:()=>{D.contas=D.contas.filter(x=>x.id!==c.id)});
}
function editCartao(c){
  const novo=!c.id,tem=!novo&&D.lancamentos.some(l=>l.cartaoId===c.id);
  form(novo?'Novo cartão':'Editar cartão',[{k:'nome',l:'Nome do cartão'},{k:'contaId',l:'Conta que paga a fatura',t:'select',o:[['','—'],...D.contas.map(x=>[x.id,x.nome])]},
   {k:'limite',l:'Limite (R$)',t:'number'},{k:'fechamento',l:'Dia do fechamento (1 a 31)',t:'number'},{k:'vencimento',l:'Dia do vencimento (1 a 31)',t:'number'},{k:'encerrado',l:'Cartão cancelado/encerrado',t:'checkbox'}],c,
  o=>{o.fechamento=Math.round(o.fechamento);o.vencimento=Math.round(o.vencimento);
    if(!o.nome||o.fechamento<1||o.fechamento>31||o.vencimento<1||o.vencimento>31){alert('Informe o nome e dias entre 1 e 31.');return false}
    if(novo)D.cartoes.push({id:uid(),...o});else Object.assign(c,o)},novo||tem?null:()=>{D.cartoes=D.cartoes.filter(x=>x.id!==c.id)});
}
function pagarFatura(f){
  if(!f)return;
  form(`Pagar fatura ${E(f.c.nome)} · ${brl(f.total)}`,[{k:'contaId',l:'Pagar com a conta',t:'select',o:contasAt().map(c=>[c.id,c.nome])},{k:'data',l:'Data do pagamento',t:'date'}],{contaId:f.c.contaId,data:hoje()},
  o=>{D.lancamentos.push({id:uid(),tipo:'Despesa',cat:'Fatura cartão',forma:'Pix',valor:f.total,data:o.data||hoje(),desc:`Fatura ${f.c.nome} ${mesFmt(f.k)}`,servicoId:'',pend:false,contaId:o.contaId,cartaoId:'',fatura:true,faturaId:f.id});
    D.faturas=D.faturas.filter(x=>x.id!==f.id);D.faturas.push({id:f.id,cartaoId:f.c.id,mes:f.k,pago:true,dataPgto:o.data||hoje(),valor:f.total})});
}

/* ===== extrato ===== */
function hist(){
  const meses=[...new Set(D.lancamentos.map(l=>mesDe(l.data)))].sort().reverse(),cats=[...new Set([...CATS,'Fatura cartão',...D.lancamentos.map(l=>l.cat)])];
  const org=l=>l.cartaoId?'k:'+l.cartaoId:'c:'+l.contaId;
  const lista=D.lancamentos.filter(l=>(!F.mes||mesDe(l.data)===F.mes)&&(!F.cat||l.cat===F.cat)&&(!F.cli||l.servicoId===F.cli)&&(!F.org||org(l)===F.org)).sort((a,b)=>b.data.localeCompare(a.data));
  const tr=lista.filter(l=>l.tipo==='Receita'&&!l.pend).reduce((a,l)=>a+l.valor,0),td=lista.filter(l=>l.tipo==='Despesa'&&!l.pend).reduce((a,l)=>a+l.valor,0);
  const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${E(v)}" ${v===sel?'selected':''}>${E(l)}</option>`).join('');
  $('#m').innerHTML=`<div class="row"><h1>🕒 Extrato</h1><button class="btn sec sm" id="csv">⬇️ CSV</button></div>
  <div class="grid" style="gap:6px">
  <select id="fm">${opt([['','Mês'],...meses.map(m=>[m,mesFmt(m)])],F.mes)}</select><select id="fc">${opt([['','Categoria'],...cats.map(c=>[c,c])],F.cat)}</select>
  <select id="fl">${opt([['','Cliente'],...D.servicos.map(s=>[s.id,s.cliente])],F.cli)}</select><select id="fo">${opt([['','Conta/cartão'],...orgOpts(true)],F.org)}</select></div>
  <div class="card row"><span>Entradas <b class="ok">${brl(tr)}</b></span><span>Saídas <b class="bad">${brl(td)}</b></span></div>
  ${lista.length?lista.map(l=>`<div class="card" data-id="${l.id}" style="cursor:pointer"><div class="row"><b>${E(l.cat)}</b><b class="${l.tipo==='Receita'?'ok':'bad'}">${l.tipo==='Receita'?'+':'−'}${brl(l.valor)}</b></div>
  <div class="k">${fd(l.data)} · ${E(orgNome(l))} · ${E(l.forma)}${l.servicoId?' · '+E(cliNome(l.servicoId)):''}${l.pend?' · <span class="tag">pendente</span>':''}</div>${l.desc?`<div>${E(l.desc)}</div>`:''}</div>`).join(''):'<div class="empty">Sem movimentações.</div>'}`;
  [['fm','mes'],['fc','cat'],['fl','cli'],['fo','org']].forEach(([i,k])=>$('#'+i).onchange=e=>{F[k]=e.target.value;hist()});
  $('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+['Data;Tipo;Categoria;Conta/Cartão;Forma;Valor;Cliente;Descrição;Pendente',...lista.map(l=>[fd(l.data),l.tipo,l.cat,orgNome(l),l.forma,String(l.valor).replace('.',','),cliNome(l.servicoId),l.desc,l.pend?'Sim':'Não'].map(q).join(';'))].join('\n')],{type:'text/csv'}));a.download='extrato.csv';a.click()};
  document.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>{const l=D.lancamentos.find(x=>x.id===c.dataset.id),cur=org(l);
    form('Editar lançamento',[{k:'tipo',l:'Tipo',t:'select',o:['Receita','Despesa']},{k:'valor',l:'Valor (R$)',t:'number'},{k:'data',l:'Data',t:'date'},{k:'org',l:'Conta / cartão',t:'select',o:orgOpts(true,cur)},{k:'cat',l:'Categoria',t:'select',o:cats},{k:'desc',l:'Descrição'},{k:'pend',l:'Pendente',t:'checkbox'}],{...l,org:cur},
    o=>{if(!o.valor){alert('Valor inválido.');return false}const [t,id]=o.org.split(':');delete o.org;o.contaId=t==='c'?id:'';o.cartaoId=t==='k'?id:'';if(t==='k')o.pend=false;Object.assign(l,o)},
    ()=>{D.lancamentos=D.lancamentos.filter(x=>x.id!==l.id);if(l.faturaId)D.faturas=D.faturas.filter(f=>f.id!==l.faturaId)})});
}
render();
</script>
</body>
