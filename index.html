<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VALIS · Finanças Pessoais · Vale do São Francisco</title>
<link rel="icon" href="https://i.ibb.co/s9YCSYhx/IMG-3813.jpg">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0f766e;--bd:#e3e6ea;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--onpri:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eceff2;--mut:#98a1ad;--pri:#2dd4bf;--bd:#2b323a;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--onpri:#06201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.grid .card{margin:0}
.k{color:var(--mut);font-size:12px}.v{font-size:19px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
label{font-size:13px;color:var(--mut)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.al{border-left:4px solid var(--warn)}.al.b{border-left-color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;font-size:10.5px;color:var(--mut);padding:4px 0;cursor:pointer}
nav button span{display:block;font-size:19px}nav button.on{color:var(--pri);font-weight:700}
.bars{display:flex;gap:8px;margin-top:8px}.bars .g{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars .p{display:flex;gap:3px;align-items:flex-end;height:90px;justify-content:center}
.bars i{display:block;width:12px;border-radius:3px 3px 0 0;min-height:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:10}
.sheet{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{width:100%;max-width:340px;text-align:center}
.logo{display:block;max-width:180px;max-height:180px;width:auto;height:auto;margin:0 auto 10px;border-radius:16px;object-fit:contain}
.done{text-decoration:line-through;color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== CONFIG: cole aqui a URL do app da web (Apps Script). Vazio = modo local de teste ===== */
const API_URL='';
const ST=['A fazer','Em andamento','Concluído','Entregue','Pago'];
const CATS=['Material','Ferramentas','Transporte','Pagamento de cliente','Pessoal','Alimentação','Aluguel','Água','Energia','Internet','Outros'];
const FORMAS=['Pix','Dinheiro','Cartão','Débito','Transferência'];
const K=['servicos','lancamentos','tarefas','contas','cartoes','faturas','fixos'];
let D={},VERSAO=0,BASE={},dirty=false,SENHA='',auth=false,view='dash',SS='',F={sv:'Todos',tf:'A fazer',mes:'',cat:'',cli:'',org:''};
K.forEach(k=>D[k]=[]);
const mem={},store={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>{const t=new Date(y,m-1,d);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const hoje=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fd=d=>d?String(d).split('-').reverse().join('/'):'—';
const mesDe=d=>String(d||'').slice(0,7),mesFmt=k=>k.slice(5)+'/'+k.slice(0,4);
const addM=(d,n)=>{const [y,m,dd]=d.split('-').map(Number),last=new Date(y,m-1+n+1,0).getDate();return ymd(y,m+n,Math.min(dd,last))};
const dias=d=>Math.round((new Date(d+'T12:00')-new Date(hoje()+'T12:00'))/864e5);
const api=(action,x={})=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,senha:SENHA,...x})}).then(r=>r.json());

/* ===== dados ===== */
const DT=(a,ks)=>a.forEach(o=>ks.forEach(k=>{if(typeof o[k]==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(o[k]))o[k]=o[k].slice(0,10)}));
const N=(a,ks)=>a.forEach(o=>ks.forEach(k=>o[k]=+o[k]||0)),B=(a,ks)=>a.forEach(o=>ks.forEach(k=>o[k]=o[k]===true||o[k]==='TRUE'||o[k]==='true'));
function normD(d){K.forEach(k=>d[k]=d[k]||[]);
  DT(d.lancamentos,['data']);DT(d.servicos,['entrega']);DT(d.faturas,['dataPgto']);
  N(d.servicos,['valor']);N(d.lancamentos,['valor']);N(d.contas,['saldoInicial']);N(d.cartoes,['limite','fechamento','vencimento']);N(d.faturas,['valor']);
  B(d.lancamentos,['pend','fatura']);B(d.tarefas,['feita']);B(d.contas,['encerrada']);B(d.cartoes,['encerrado']);B(d.faturas,['pago']);N(d.fixos,['valor','dia']);B(d.fixos,['encerrado']);
  d.servicos.forEach(s=>{if(!['Banco','Espécie'].includes(s.destino))s.destino='Banco'});
  d.contas.forEach(c=>{if(!c.tipo)c.tipo=c.nome==='Espécie'?'Espécie':'Banco'});return d}
const snap=d=>{const b={};K.forEach(k=>{b[k]={};d[k].forEach(o=>b[k][o.id]=JSON.stringify(o))});return b};
function norm(){normD(D);BASE=snap(D);let seed=false;
  if(!D.contas.length&&!D.lancamentos.length&&!D.cartoes.length){seed=true;[['Bradesco','Banco'],['Itaú','Banco'],['PicPay','Banco'],['Espécie','Espécie']].forEach(([n,t])=>D.contas.push({id:uid(),nome:n,tipo:t,saldoInicial:0,encerrada:false}))}
  return seed}
/* mescla alterações locais (em relação a B, o último estado sincronizado) sobre os dados mais novos da planilha S */
function mesclar(B,L,S){const R={};K.forEach(k=>{const m={},li={};S[k].forEach(o=>m[o.id]=o);
  L[k].forEach(o=>{li[o.id]=1;if(B[k][o.id]!==JSON.stringify(o))m[o.id]=o});
  Object.keys(B[k]).forEach(id=>{if(!li[id])delete m[id]});R[k]=Object.values(m)});return R}
let tm,busy=false,again=false;
function setSS(t){SS=t;const e=$('#ss');if(e)e.textContent=t}
function save(){if(!API_URL){store.set('cpf_data',JSON.stringify(D));return}
  dirty=true;setSS('⏳ Salvando…');clearTimeout(tm);tm=setTimeout(enviar,700)}
async function enviar(){
  if(busy){again=true;return}busy=true;let mesclou=false,r,sent;
  try{for(let i=0;i<3;i++){sent=snap(D);r=await api('salvar',{dados:D,versao:VERSAO});if(!r.conflito)break;
      mesclou=true;const S=normD(r.dados);D=mesclar(BASE,D,S);BASE=snap(S);VERSAO=r.versao}
    if(r.ok){VERSAO=r.versao;BASE=sent;if(!again)dirty=false;setSS(mesclou?'☁️ Salvo (mesclado com alterações de outro aparelho)':'☁️ Salvo na planilha');
      if(mesclou&&!document.querySelector('.modal'))render()}
    else setSS('⚠️ '+(r.erro||'Conflito. Toque em Recarregar no Relatório'))}
  catch(e){setSS('⚠️ Sem conexão. Toque aqui para tentar de novo')}
  busy=false;if(again){again=false;enviar()}}
const contasAt=()=>D.contas.filter(c=>!c.encerrada),cartoesAt=()=>D.cartoes.filter(c=>!c.encerrado);
const movConta=id=>D.lancamentos.filter(l=>l.contaId===id&&!l.cartaoId&&!l.pend);
const saldo=c=>c.saldoInicial+movConta(c.id).reduce((a,l)=>a+(l.tipo==='Receita'?l.valor:-l.valor),0);
const cliNome=id=>(D.servicos.find(s=>s.id===id)||{}).cliente||'';
const recebido=s=>D.lancamentos.filter(l=>l.servicoId===s.id&&l.tipo==='Receita'&&!l.pend).reduce((a,l)=>a+l.valor,0);
const restante=s=>Math.max(0,Math.round((s.valor-recebido(s))*100)/100);
const orgNome=l=>l.cartaoId?'💳 '+((D.cartoes.find(c=>c.id===l.cartaoId)||{}).nome||'?'):'🏦 '+((D.contas.find(c=>c.id===l.contaId)||{}).nome||'—');
function orgOpts(despesa,cur){const o=[];D.contas.filter(c=>!c.encerrada||'c:'+c.id===cur).forEach(c=>o.push(['c:'+c.id,'🏦 '+c.nome]));
  if(despesa)D.cartoes.filter(c=>!c.encerrado||'k:'+c.id===cur).forEach(c=>o.push(['k:'+c.id,'💳 '+c.nome+' (crédito)']));return o}

/* ===== faturas de cartão ===== */
const chave=(c,date)=>{let [y,m,d]=date.split('-').map(Number);if(d>c.fechamento)m++;const t=new Date(y,m-1,1);return t.getFullYear()+'-'+pad(t.getMonth()+1)};
const venc=(c,k)=>{let [y,m]=k.split('-').map(Number);if(c.vencimento<=c.fechamento)m++;const t=new Date(y,m-1,1),ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(t.getFullYear(),t.getMonth()+1,Math.min(c.vencimento,ult))};
function listaFaturas(){const out=[],r2=n=>Math.round(n*100)/100;D.cartoes.forEach(c=>{const g={};D.lancamentos.filter(l=>l.cartaoId===c.id).forEach(l=>{const k=chave(c,l.data);g[k]=(g[k]||0)+l.valor});
  Object.keys(g).forEach(k=>{const id=c.id+'|'+k,total=r2(g[k]),pg=r2(D.lancamentos.filter(l=>l.faturaId===id).reduce((a,l)=>a+l.valor,0)),falta=r2(total-pg);
    out.push({id,c,k,total:falta>0.004?falta:total,pago:falta<=0.004,resto:pg>0&&falta>0.004,venc:venc(c,k)})})});
  return out.sort((a,b)=>a.venc.localeCompare(b.venc))}
const alertas=()=>listaFaturas().filter(f=>!f.pago&&f.total>0&&dias(f.venc)<=7);
function statusFat(f){if(f.pago)return'Paga';const d=dias(f.venc);
  return(f.resto?'Complemento · ':'')+(d<0?`Vencida há ${-d} dia(s)`:d===0?'Vence hoje':d<=7?`Vence em ${d} dia(s)`:'Em aberto')}

/* ===== gastos fixos: geram uma despesa pendente por mês (mês atual e o próximo) ===== */
function gerarFixos(){let mudou=false;const h=hoje(),m0=h.slice(0,7),m1=mesDe(addM(h.slice(0,8)+'01',1));
  D.fixos.filter(f=>!f.encerrado).forEach(f=>[m0,m1].forEach(m=>{
    const id='fx_'+f.id+'_'+m;
    if((f.pulados||'').split(',').includes(m)||D.lancamentos.some(l=>l.id===id||(l.fixoId===f.id&&l.fixoMes===m)))return;
    const [y,mm]=m.split('-').map(Number),dia=Math.min(f.dia||1,new Date(y,mm,0).getDate());
    D.lancamentos.push({id,tipo:'Despesa',cat:f.cat||'Outros',forma:'Pix',valor:f.valor,data:ymd(y,mm,dia),desc:f.nome,servicoId:'',pend:true,contaId:f.contaId||'',cartaoId:'',fatura:false,fixoId:f.id,fixoMes:m});mudou=true}));
  return mudou}
const pendAl=()=>D.lancamentos.filter(l=>l.tipo==='Despesa'&&l.pend&&!l.cartaoId&&dias(l.data)<=7).sort((a,b)=>a.data.localeCompare(b.data));
function editFixo(f){
  const novo=!f.id;
  form(novo?'Novo gasto fixo':'Editar gasto fixo',[{k:'nome',l:'Nome (água, energia, aluguel, internet…)'},{k:'valor',l:'Valor mensal estimado (R$)',t:'number'},{k:'dia',l:'Dia do vencimento (1 a 31)',t:'number'},
    {k:'cat',l:'Categoria',t:'select',o:CATS},{k:'contaId',l:'Pago com a conta',t:'select',o:[['','—'],...contasAt().map(c=>[c.id,c.nome])]},{k:'encerrado',l:'Gasto encerrado (para de gerar contas)',t:'checkbox'}],
    {cat:'Outros',...f},
    o=>{o.dia=Math.round(o.dia);if(!o.nome||o.dia<1||o.dia>31){alert('Informe o nome e o dia (1 a 31).');return false}
      const fx=novo?{id:uid(),pulados:''}:D.fixos.find(x=>x.id===f.id);Object.assign(fx,o);
      if(novo){D.fixos.push(fx);const h=hoje();if(o.dia<+h.slice(8)&&confirm(`O vencimento deste mês (dia ${o.dia}) já passou.\nEsse gasto já foi pago neste mês?\nOK = não lançar este mês.`))fx.pulados+=h.slice(0,7)+','}
      D.lancamentos.forEach(l=>{if(l.fixoId===fx.id&&l.pend){const [y,m]=l.fixoMes.split('-').map(Number);Object.assign(l,{valor:fx.valor,cat:fx.cat,desc:fx.nome,contaId:fx.contaId||'',data:ymd(y,m,Math.min(fx.dia,new Date(y,m,0).getDate()))})}});
      gerarFixos()},
    novo?null:()=>{D.fixos=D.fixos.filter(x=>x.id!==f.id);D.lancamentos=D.lancamentos.filter(l=>!(l.fixoId===f.id&&l.pend))});
}

/* ===== login / render ===== */
function login(){
  $('#app').innerHTML=`<div class="login"><div class="card"><img src="https://i.ibb.co/s9YCSYhx/IMG-3813.jpg" alt="VALIS" class="logo" onerror="this.style.display='none'"><h1 style="margin-bottom:2px">VALIS</h1><div class="k" style="margin-bottom:14px">Finanças Pessoais · Vale do São Francisco</div><p class="k">Digite sua senha</p>
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><div id="er" class="bad" style="min-height:18px;font-size:13px"></div>
  <button class="btn" style="width:100%" id="go">Entrar</button></div></div>`;
  const go=async()=>{const p=$('#pw').value;SENHA=p;
    if(API_URL){$('#er').textContent='Carregando…';try{const r=await api('login');if(!r.ok){$('#er').textContent=r.erro;return}D=r.dados;VERSAO=r.versao}catch(e){$('#er').textContent='Sem conexão com a planilha.';return}}
    else{if(p!==(store.get('cpf_pw')||'admin2026')){$('#er').textContent='Senha incorreta.';return}try{const s=store.get('cpf_data');if(s)D=JSON.parse(s)}catch(e){}}
    auth=true;if(norm())save();setSS(API_URL?'☁️ Conectado à planilha':'');render()};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}
function render(){
  if(!auth)return login();
  if(gerarFixos())save();
  const n=alertas().length+pendAl().length,nav=[['dash','📊','Relatório'],['serv','🛠️','Serviços'],['lanc','➕','Lançar'],['tar','✅','Tarefas'],['cont','🏦','Contas'],['hist','🕒','Extrato']];
  $('#app').innerHTML=`<main><div class="k" id="ss" style="text-align:right">${E(SS)}</div><div id="m"></div></main><nav>${nav.map(x=>`<button class="${view===x[0]?'on':''}" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}${x[0]==='cont'&&n?` <b style="color:var(--bad)">●${n}</b>`:''}</button>`).join('')}</nav>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
  $('#ss').onclick=()=>{if(SS.startsWith('⚠️'))save()};
  ({dash,serv,lanc,tar,cont,hist})[view]();window.scrollTo(0,0);
}

/* ===== modal genérico ===== */
function form(title,fields,vals,onSave,onDel){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h1>${title}</h1>${fields.map(f=>{const v=vals[f.k]??'';
    if(f.t==='select')return`<label>${f.l}</label><select data-k="${f.k}">${f.o.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return`<option value="${E(ov)}" ${ov==v?'selected':''}>${E(ol)}</option>`}).join('')}</select>`;
    if(f.t==='checkbox')return`<label style="display:block;margin-bottom:10px"><input type="checkbox" data-k="${f.k}" ${v?'checked':''}>${f.l}</label>`;
    if(f.t==='textarea')return`<label>${f.l}</label><textarea rows="2" data-k="${f.k}">${E(v)}</textarea>`;
    return`<label>${f.l}</label><input type="${f.t||'text'}" ${f.t==='number'?'step="0.01" inputmode="decimal"':''} data-k="${f.k}" value="${E(v)}">`}).join('')}
  <div class="row"><button class="btn sec" id="cx">Cancelar</button>${onDel?'<button class="btn sec bad" id="dl">Excluir</button>':''}<button class="btn" id="sv">Salvar</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();
  m.onclick=e=>{if(e.target===m)close()};m.querySelector('#cx').onclick=close;
  if(onDel)m.querySelector('#dl').onclick=()=>{if(confirm('Excluir este item?')){onDel();close();save();render()}};
  m.querySelector('#sv').onclick=()=>{const o={};
    m.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='checkbox'?i.checked:i.type==='number'?parseFloat(i.value)||0:i.value.trim());
    if(onSave(o)===false)return;close();save();render()};
}

/* ===== relatório ===== */
function dash(){
  const L=D.lancamentos,rec=L.filter(l=>l.tipo==='Receita'&&!l.pend),des=L.filter(l=>l.tipo==='Despesa'&&!l.pend&&!l.fatura);
  const S=a=>a.reduce((x,l)=>x+l.valor,0),sm=(a,m)=>S(a.filter(l=>mesDe(l.data)===m));
  const tot=D.contas.reduce((a,c)=>a+saldo(c),0);
  const aRec=D.servicos.filter(s=>s.status!=='Pago').reduce((a,s)=>a+restante(s),0);
  const aPag=S(L.filter(l=>l.tipo==='Despesa'&&l.pend&&!l.cartaoId&&mesDe(l.data)<=hoje().slice(0,7)))+listaFaturas().filter(f=>!f.pago).reduce((a,f)=>a+f.total,0);
  const mes=hoje().slice(0,7),mr=sm(rec,mes),md=sm(des,mes),al=alertas();
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();ms.push(mesDe(ymd(d.getFullYear(),d.getMonth()+1-i,1)))}
  const dd=ms.map(m=>[m,sm(rec,m),sm(des,m)]),mx=Math.max(1,...dd.flatMap(d=>[d[1],d[2]]));
  $('#m').innerHTML=`<h1>📊 Relatório</h1>
  ${al.map(f=>`<div class="card al ${dias(f.venc)<0?'b':''} row"><div><b>💳 ${E(f.c.nome)}</b> · ${brl(f.total)}<div class="k">${statusFat(f)} · ${fd(f.venc)}</div></div><button class="btn sm" data-pf="${f.id}">Pagar</button></div>`).join('')}
  ${pendAl().map(l=>{const d=dias(l.data);return`<div class="card al ${d<0?'b':''} row"><div><b>🧾 ${E(l.desc||l.cat)}</b> · ${brl(l.valor)}<div class="k">${d<0?`Vencida há ${-d} dia(s)`:d===0?'Vence hoje':`Vence em ${d} dia(s)`} · ${fd(l.data)}</div></div><button class="btn sm" data-pg="${l.id}">Pagar</button></div>`}).join('')}
  <div class="grid"><div class="card"><div class="k">Saldo total (contas)</div><div class="v ${tot<0?'bad':'ok'}">${brl(tot)}</div></div>
  <div class="card"><div class="k">A receber</div><div class="v">${brl(aRec)}</div></div>

  <div class="card row"><span>Entradas <b class="ok">${brl(tr)}</b></span><span>Saídas <b class="bad">${brl(td)}</b></span></div>
  ${lista.length?lista.map(l=>`<div class="card" data-id="${l.id}" style="cursor:pointer"><div class="row"><b>${E(l.cat)}</b><b class="${l.tipo==='Receita'?'ok':'bad'}">${l.tipo==='Receita'?'+':'−'}${brl(l.valor)}</b></div>
  <div class="k">${fd(l.data)} · ${E(orgNome(l))} · ${E(l.forma)}${l.servicoId?' · '+E(cliNome(l.servicoId)):''}${l.pend?' · <span class="tag">pendente</span>':''}</div>${l.desc?`<div>${E(l.desc)}</div>`:''}${l.pend?`<div style="margin-top:8px"><button class="btn sm" data-pg="${l.id}">✔ Marcar como ${l.tipo==='Despesa'?'paga':'recebida'}</button></div>`:''}</div>`).join(''):'<div class="empty">Sem movimentações.</div>'}`;
  document.querySelectorAll('[data-pg]').forEach(b=>b.onclick=e=>{e.stopPropagation();quitar(D.lancamentos.find(x=>x.id===b.dataset.pg))});
  [['fm','mes'],['fc','cat'],['fl','cli'],['fo','org']].forEach(([i,k])=>$('#'+i).onchange=e=>{F[k]=e.target.value;hist()});
  $('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+['Data;Tipo;Categoria;Conta/Cartão;Forma;Valor;Cliente;Descrição;Pendente',...lista.map(l=>[fd(l.data),l.tipo,l.cat,orgNome(l),l.forma,String(l.valor).replace('.',','),cliNome(l.servicoId),l.desc,l.pend?'Sim':'Não'].map(q).join(';'))].join('\n')],{type:'text/csv'}));a.download='extrato.csv';a.click()};
  document.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>{const l=D.lancamentos.find(x=>x.id===c.dataset.id),cur=org(l);
    form('Editar lançamento',[{k:'tipo',l:'Tipo',t:'select',o:['Receita','Despesa']},{k:'valor',l:'Valor (R$)',t:'number'},{k:'data',l:'Data',t:'date'},{k:'org',l:'Conta / cartão',t:'select',o:orgOpts(true,cur)},{k:'cat',l:'Categoria',t:'select',o:cats},{k:'desc',l:'Descrição'},{k:'pend',l:'Pendente',t:'checkbox'}],{...l,org:cur},
    o=>{if(!o.valor){alert('Valor inválido.');return false}const [t,id]=o.org.split(':');delete o.org;o.contaId=t==='c'?id:'';o.cartaoId=t==='k'?id:'';if(t==='k')o.pend=false;Object.assign(l,o)},
    ()=>{if(l.fixoId){const fx=D.fixos.find(x=>x.id===l.fixoId);if(fx)fx.pulados=(fx.pulados||'')+l.fixoMes+','}
      const g=l.grupoId?D.lancamentos.filter(x=>x.grupoId===l.grupoId):[];
      if(g.length>1&&confirm(`Compra parcelada em ${g.length} parcelas.\nOK = excluir TODAS as parcelas.\nCancelar = excluir só esta.`))D.lancamentos=D.lancamentos.filter(x=>x.grupoId!==l.grupoId);else D.lancamentos=D.lancamentos.filter(x=>x.id!==l.id)})});
}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden||!auth||!API_URL||busy||dirty||document.querySelector('.modal'))return;
  try{const v=await api('versao');if(v.ok&&String(v.versao)!==String(VERSAO)){const c=await api('carregar');
    if(c.ok&&!dirty&&!document.querySelector('.modal')){D=c.dados;VERSAO=c.versao;norm();setSS('☁️ Atualizado (outro aparelho)');render()}}}catch(e){}});
render();
</script>
</body>
</html>
